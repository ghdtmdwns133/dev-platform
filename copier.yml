_subdirectory: template

project_name:
  type: str
  help: Repository and project name.
  validator: "{% if not project_name %}A project name is required{% endif %}"

stack:
  type: str
  help: Project stack.
  choices:
    Python: python
    TypeScript: typescript
    .NET: dotnet
    Unity: unity
    Other: other

owner:
  type: str
  help: GitHub account that owns the generated repository.
  default: ghdtmdwns133
  validator: "{% if not owner %}An owner is required{% endif %}"

visibility:
  type: str
  help: Repository visibility.
  default: private
  choices:
    Private: private
    Public: public

unity_runner:
  type: str
  help: >-
    Where Unity tests and builds run. "none" runs integrity only, "self-hosted"
    uses a private repository runner labelled [self-hosted, windows, unity],
    and "uba" uses Unity Build Automation with its three repository secrets.
  default: none
  choices:
    None: none
    Self-hosted: self-hosted
    Unity Build Automation: uba
  when: "{{ stack == 'unity' }}"
  validator: >-
    {% if visibility == 'public' and unity_runner == 'self-hosted' %}A public repository cannot use a self-hosted Unity runner; choose none or uba{% endif %}

run_tests:
  type: bool
  help: >-
    Run the repository's native "mise run test" task in CI. Enable this only
    once a real test task exists; this template does not create one for the
    other stack.
  default: "{{ 'false' if stack in ['other', 'unity'] else 'true' }}"
  when: "{{ stack == 'other' }}"

platform_ref:
  type: str
  help: dev-platform ref used by caller workflows.
  default: v1

min_coverage:
  type: int
  help: Minimum line coverage percentage.
  default: 80
  validator: >-
    {% if min_coverage < 0 or min_coverage > 100 %}min_coverage must be between 0 and 100 inclusive{% endif %}

create_github_repo:
  type: bool
  help: >-
    Recorded for bootstrap compatibility. A direct Copier render does not create
    or configure the GitHub repository; it still fetches the template.
  default: true

enable_codecov:
  type: bool
  help: Upload coverage to Codecov when a token is available.
  default: false

enable_sentry:
  type: bool
  help: Create the Sentry project and set its secrets during bootstrap.
  default: false
  when: "{{ stack == 'typescript' }}"

_exclude:
  - |
    {% if stack != 'python' %}
    /src/devflow
    /tests/test_pipeline.py
    /pyproject.toml
    /uv.lock
    /.python-version
    {% endif %}
  - |
    {% if stack != 'typescript' %}
    /src/App.tsx
    /src/App.test.tsx
    /src/main.tsx
    /src/instrument.ts
    /src/vite-env.d.ts
    /src/components
    /vite.config.ts
    /tsconfig.json
    /eslint.config.js
    /.prettierrc.json
    /.prettierignore
    /index.html
    /package.json
    /package-lock.json
    /scripts
    {% endif %}
  - |
    {% if stack != 'dotnet' %}
    /src/DevFlow.Core
    /tests/DevFlow.Core.Tests
    /DevFlow.slnx
    /Directory.Build.props
    /Directory.Packages.props
    /global.json
    {% endif %}
  - |
    {% if stack != 'unity' %}
    /Assets
    /.devplatform
    /docs
    {% endif %}
  - |
    {% if stack != 'dotnet' and stack != 'unity' %}
    /version.txt
    {% endif %}
  - |
    {% if stack == 'unity' or stack == 'other' %}
    /src
    /.devcontainer
    {% endif %}
  - |
    {% if stack != 'python' and stack != 'dotnet' %}
    /tests
    {% endif %}
  - |
    {% if stack == 'other' %}
    /.github/workflows/nightly.yml
    /.github/workflows/release.yml
    /release-please-config.json
    /.release-please-manifest.json
    {% endif %}
  - |
    {% if stack == 'unity' and (visibility == 'public' or unity_runner != 'self-hosted') %}
    /.github/workflows/release.yml
    /release-please-config.json
    /.release-please-manifest.json
    {% endif %}
  - |
    {% if _copier_operation == 'update' %}
    /README.md
    {% if stack == 'python' %}
    /src/devflow
    /tests
    /pyproject.toml
    /uv.lock
    /.python-version
    {% endif %}
    {% if stack == 'typescript' %}
    /src
    /index.html
    /package.json
    /package-lock.json
    {% endif %}
    {% if stack == 'dotnet' %}
    /src/DevFlow.Core
    /tests
    /Directory.Packages.props
    /version.txt
    {% endif %}
    {% if stack == 'unity' %}
    /.devplatform
    /version.txt
    {% endif %}
    {% endif %}

_message_after_copy: |
  Rendered {{ project_name }} ({{ stack }}) with the dev-platform template.

  A direct Copier render does not call GitHub APIs: it does not create a
  repository or apply repository settings (it still fetches the template). To
  create or configure the repository, run the bootstrap documented in
  dev-platform's docs/ADOPTION.md from a retained dev-platform checkout; the
  bootstrap reports what it completed.

  Renovate keeps the template up to date after the repository is onboarded.
