name: Nightly

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory relative to the repository root.
        required: false
        default: "."
        type: string
      enable-codecov:
        description: Upload coverage to Codecov when the codecov_token secret is present.
        required: false
        default: false
        type: boolean
      platform-ref:
        description: dev-platform ref this caller uses; reserved for the addressed tag.
        required: false
        default: v1
        type: string
    secrets:
      codecov_token:
        description: Codecov upload token.
        required: false

permissions:
  contents: read

jobs:
  deep-security:
    name: deep-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the deep security scan
        uses: ghdtmdwns133/dev-platform/actions/security-scan@v1
        with:
          severity: MEDIUM,HIGH,CRITICAL
          upload-sarif: false
          deep: true

  verify:
    name: verify
    uses: ./.github/workflows/ci.yml
    with:
      run-tests: true
      enable-codecov: ${{ inputs.enable-codecov }}
      working-directory: ${{ inputs.working-directory }}
    secrets:
      codecov_token: ${{ secrets.codecov_token }}

  notify:
    name: notify
    needs: [deep-security, verify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        uses: ghdtmdwns133/dev-platform/actions/notify@v1
        with:
          status: nightly job failed
          title: "CI failure: ${{ github.workflow }}"
          label: ci-alert
