name: Nightly

on:
  workflow_call:
    inputs:
      profile:
        description: Verification profile used by the full verification run.
        required: true
        type: string
      platform-ref:
        description: dev-platform ref checked out for the CLI.
        required: false
        default: v1
        type: string

permissions:
  contents: read

jobs:
  deep-security:
    name: deep-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run deep security scan
        uses: ghdtmdwns133/dev-platform/actions/security-scan@v1
        with:
          severity: MEDIUM,HIGH,CRITICAL
          upload-sarif: false
          deep: true

  full-verify:
    name: full-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run full verification
        uses: ghdtmdwns133/dev-platform/actions/verify@v1
        with:
          profile: ${{ inputs.profile }}
          min-coverage: "0"
          ref: ${{ inputs.platform-ref }}

  freshness:
    name: freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js
        if: ${{ inputs.profile == 'typescript' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up .NET
        if: ${{ inputs.profile == 'dotnet' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check uv lock freshness
        if: ${{ inputs.profile == 'python' }}
        shell: bash
        run: uv lock --check
      - name: Check outdated npm packages
        if: ${{ inputs.profile == 'typescript' }}
        shell: bash
        run: npm outdated --depth=0 || true
      - name: Check vulnerable .NET packages
        if: ${{ inputs.profile == 'dotnet' }}
        shell: bash
        run: dotnet list package --vulnerable --include-transitive

  notify:
    name: notify
    needs: [deep-security, full-verify, freshness]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        uses: ghdtmdwns133/dev-platform/actions/notify@v1
        with:
          status: nightly job failed
          title: "CI failure: ${{ github.workflow }}"
          label: ci-alert
          profile: ${{ inputs.profile }}
