name: Unity

on:
  workflow_call:
    inputs:
      unity-runner:
        description: Where to run Unity (none, self-hosted or uba).
        required: false
        default: none
        type: string
      project-path:
        description: Unity project directory relative to the repository root.
        required: false
        default: "."
        type: string
      build:
        description: Build and zip a player (tags and nightly only).
        required: false
        default: false
        type: boolean
      enable-odin:
        description: Run the Odin validation entry point after Unity tests.
        required: false
        default: false
        type: boolean
      platform-ref:
        description: dev-platform ref checked out for the CLI.
        required: false
        default: v1
        type: string
      cloud-build-target:
        description: Unity Build Automation build target id (empty uses unity.cloudBuild.target).
        required: false
        default: ""
        type: string
    secrets:
      codecov_token:
        description: Codecov upload token for Unity coverage.
        required: false
      UNITY_BUILD_API_KEY:
        description: Unity Build Automation API key.
        required: false
      UNITY_BUILD_ORG_ID:
        description: Unity Cloud organization id.
        required: false
      UNITY_BUILD_PROJECT_ID:
        description: Unity Cloud project id.
        required: false

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      unity_changed: ${{ steps.diff.outputs.unity_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Unity-relevant changes
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changed=true
          base=""
          case "$EVENT_NAME" in
            push) base="${BEFORE_SHA:-}" ;;
            pull_request) base="${PR_BASE_SHA:-}" ;;
            *) base="" ;;
          esac
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            if files=$(git diff --name-only "$base" "$HEAD_SHA" 2>/dev/null); then
              if printf '%s\n' "$files" | grep -Eq '^(Assets|Packages|ProjectSettings)/'; then
                changed=true
              else
                changed=false
              fi
            fi
          fi
          echo "unity_changed=${changed}" >> "$GITHUB_OUTPUT"

  integrity:
    name: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report Unity availability
        if: ${{ inputs.unity-runner == 'none' }}
        shell: bash
        run: echo "::notice::Unity runner is 'none'; Unity tests/build skipped."
      - name: Check out dev-platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ghdtmdwns133/dev-platform
          ref: ${{ inputs.platform-ref }}
          path: .dev-platform
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify Unity project integrity
        shell: bash
        working-directory: ${{ inputs.project-path }}
        env:
          PLATFORM_CLI: ${{ github.workspace }}/.dev-platform/cli
        run: uv run --project "$PLATFORM_CLI" devctl verify --profile unity-assets
      - name: Upload integrity reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-unity-assets
          path: ${{ inputs.project-path }}/artifacts/reports
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: tests
    needs: changes
    if: ${{ inputs.unity-runner == 'self-hosted' && github.event.repository.private == true }}
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 60
    concurrency:
      group: unity-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-path }}
    env:
      CODECOV_TOKEN: ${{ secrets.codecov_token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false
      - name: Check out dev-platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ghdtmdwns133/dev-platform
          ref: ${{ inputs.platform-ref }}
          path: .dev-platform
          clean: false
          persist-credentials: false
      - name: Check uv availability
        shell: pwsh
        run: uv --version
      - name: Report no Unity-relevant changes
        if: ${{ needs.changes.outputs.unity_changed != 'true' }}
        shell: pwsh
        run: Write-Host "::notice::no Unity-relevant changes"
      - name: Run Unity verification
        if: ${{ needs.changes.outputs.unity_changed == 'true' }}
        shell: pwsh
        run: uv run --project "$env:GITHUB_WORKSPACE/.dev-platform/cli" devctl verify --profile unity
      - name: Upload Unity coverage to Codecov
        if: ${{ needs.changes.outputs.unity_changed == 'true' && env.CODECOV_TOKEN != '' }}
        shell: pwsh
        run: uv run --project "$env:GITHUB_WORKSPACE/.dev-platform/cli" devctl unity coverage-upload
      - name: Report missing Codecov token
        if: ${{ needs.changes.outputs.unity_changed == 'true' && env.CODECOV_TOKEN == '' }}
        shell: pwsh
        run: Write-Host "::notice::Codecov skipped (no token)"
      - name: Run Odin validation
        if: ${{ needs.changes.outputs.unity_changed == 'true' && inputs.enable-odin }}
        shell: pwsh
        run: uv run --project "$env:GITHUB_WORKSPACE/.dev-platform/cli" devctl unity odin
      - name: Upload Unity test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-unity
          path: ${{ inputs.project-path }}/artifacts/reports
          if-no-files-found: warn
          retention-days: 14

  build:
    name: build
    needs: [changes, tests]
    if: ${{ inputs.unity-runner == 'self-hosted' && inputs.build && github.event.repository.private == true }}
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 60
    concurrency:
      group: unity-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.project-path }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: false
          persist-credentials: false
      - name: Check out dev-platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ghdtmdwns133/dev-platform
          ref: ${{ inputs.platform-ref }}
          path: .dev-platform
          clean: false
          persist-credentials: false
      - name: Check uv availability
        shell: pwsh
        run: uv --version
      - name: Build player
        shell: pwsh
        run: uv run --project "$env:GITHUB_WORKSPACE/.dev-platform/cli" devctl unity build
      - name: Package build
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path artifacts/unity-build/* -DestinationPath "artifacts/ProjectDelta-$ref.zip" -Force
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-build
          path: ${{ inputs.project-path }}/artifacts/ProjectDelta-*.zip
          if-no-files-found: warn
          retention-days: 14

  cloud-build:
    name: cloud-build
    needs: changes
    if: ${{ inputs.unity-runner == 'uba' && needs.changes.outputs.unity_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build with Unity Build Automation
        uses: ghdtmdwns133/dev-platform/actions/unity-cloud-build@v1
        with:
          ref: ${{ inputs.platform-ref }}
          api-key: ${{ secrets.UNITY_BUILD_API_KEY }}
          org-id: ${{ secrets.UNITY_BUILD_ORG_ID }}
          project-id: ${{ secrets.UNITY_BUILD_PROJECT_ID }}
          commit: ${{ github.sha }}
          target: ${{ inputs.cloud-build-target }}
          working-directory: ${{ inputs.project-path }}

  notify:
    name: notify
    needs: [changes, integrity, tests, build, cloud-build]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        uses: ghdtmdwns133/dev-platform/actions/notify@v1
        with:
          status: unity job failed
          title: "CI failure: ${{ github.workflow }}"
          label: ci-alert
          profile: unity
