name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please strategy (python, node or simple).
        required: false
        default: simple
        type: string
      profile:
        description: Keep "unity" for the Unity release path (UBA or self-hosted); any other value uses the mise build job.
        required: false
        default: ""
        type: string
      build-command:
        description: Command that produces the release artifacts.
        required: true
        type: string
      artifact-path:
        description: Path uploaded from the build job and attached to the release.
        required: false
        default: ""
        type: string
      artifact-name:
        description: Artifact name shared between the build and publish jobs.
        required: false
        default: ""
        type: string
      runs-on:
        description: JSON string of runner labels (a quoted string or an array).
        required: false
        default: '"ubuntu-latest"'
        type: string
      ci-workflow:
        description: Caller workflow file dispatched on the release pull request branch.
        required: false
        default: ci.yml
        type: string
      merge-wait-minutes:
        description: >-
          Minutes the release job waits for the release PR to auto-merge before
          creating the release in the same run. 0 disables waiting; the next push
          or the daily schedule then creates the release. Use 0 on private repos
          to avoid billed idle minutes.
        required: false
        default: 15
        type: number
      rebuild-tag:
        description: >-
          Existing release tag whose assets are rebuilt and re-attached (for a
          failed release build). Empty runs the normal release-please flow.
        required: false
        default: ""
        type: string
      platform-ref:
        description: dev-platform ref checked out for the CLI.
        required: false
        default: v1
        type: string
      unity-build-target:
        description: Unity Build Automation build target id (empty uses unity.cloudBuild.target).
        required: false
        default: ""
        type: string
    secrets:
      unity_build_api_key:
        description: Unity Build Automation API key; enables the cloud build path.
        required: false
      unity_build_org_id:
        description: Unity Cloud organization id.
        required: false
      unity_build_project_id:
        description: Unity Cloud project id.
        required: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release-please--')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ inputs.rebuild-tag != '' && 'true' || (steps.release-pr.outputs.release_created == 'true' && steps.release-pr.outputs.release_created || steps.release.outputs.release_created) }}
      tag_name: ${{ inputs.rebuild-tag != '' && inputs.rebuild-tag || (steps.release-pr.outputs.release_created == 'true' && steps.release-pr.outputs.tag_name || steps.release.outputs.tag_name) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release-please configuration
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail
          test -f release-please-config.json || { echo "::error::release-please-config.json is missing"; exit 1; }
          test -f .release-please-manifest.json || { echo "::error::.release-please-manifest.json is missing"; exit 1; }
          configured=$(jq -r '.packages["."]["release-type"] // empty' release-please-config.json)
          if [ -n "$configured" ] && [ "$configured" != "$RELEASE_TYPE" ]; then
            echo "::error::release-please-config.json release-type '${configured}' does not match input '${RELEASE_TYPE}'"
            exit 1
          fi
      - name: Confirm the release to rebuild
        if: ${{ inputs.rebuild-tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.rebuild-tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --json tagName --jq .tagName >/dev/null || {
            echo "::error::No GitHub release exists for tag ${TAG_NAME}"
            exit 1
          }
          echo "::notice::Rebuilding and re-attaching assets for existing release ${TAG_NAME}"
      - name: Merge the release pull request after successful CI
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          # shellcheck disable=SC2016 # $sha is a jq --arg, not a shell variable
          set -euo pipefail
          number=$(gh pr list --state all --head "$HEAD_BRANCH" --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "::error::No release pull request found for ${HEAD_BRANCH}"
            exit 1
          fi
          state=$(gh pr view "$number" --json state --jq .state)
          if [ "$state" = "MERGED" ]; then
            echo "::notice::release PR #${number} was already merged"
            exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            echo "::error::release PR #${number} is ${state}"
            exit 1
          fi
          current=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::warning::release PR head moved to ${current}; dispatching CI again"
            gh workflow run "$CI_WORKFLOW" --ref "$HEAD_BRANCH"
            exit 0
          fi
          approve_pending() {
            ids=$(gh run list --branch "$HEAD_BRANCH" --event pull_request --limit 20 \
              --json databaseId,conclusion,headSha \
              --jq '.[] | select(.conclusion == "action_required") | "\(.databaseId) \(.headSha)"' \
              | awk -v sha="$1" '$2 == sha {print $1}')
            for id in $ids; do
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null; then
                echo "::notice::approved workflow run ${id}"
              else
                echo "::warning::could not approve workflow run ${id}"
              fi
            done
          }
          approve_pending "$HEAD_SHA"
          merged=false
          for _ in $(seq 1 12); do
            state=$(gh pr view "$number" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              merged=true
              break
            fi
            mergeable=$(gh pr view "$number" --json mergeable --jq .mergeable)
            if [ "$mergeable" = "MERGEABLE" ]; then
              if gh pr merge "$number" --squash --match-head-commit "$HEAD_SHA"; then
                merged=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$merged" != "true" ]; then
            echo "::error::release PR #${number} did not become mergeable and merged"
            exit 1
          fi
          echo "::notice::Merged release PR #${number}"
      - name: Check out the updated default branch
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run release-please
        id: release-pr
        if: ${{ inputs.rebuild-tag == '' }}
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Label, auto-merge and dispatch CI for release PRs
        if: ${{ inputs.rebuild-tag == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          set -euo pipefail
          gh label create automerge --color 0E8A16 \
            --description "Auto-merge when required checks pass" --force
          prs=""
          for _ in $(seq 1 12); do
            prs=$(gh pr list --label "autorelease: pending" --state open \
              --json number,headRefName,headRefOid \
              --jq '.[] | "\(.number)\t\(.headRefName)\t\(.headRefOid)"')
            if [ -n "$prs" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$prs" ]; then
            echo "::notice::release-please has no open release pull request"
            exit 0
          fi
          while IFS=$'\t' read -r number branch sha; do
            if [ -z "$number" ]; then
              continue
            fi
            gh pr edit "$number" --add-label automerge
            if ! gh pr merge --auto --squash "$number"; then
              echo "::warning::Could not enable auto-merge for release PR #${number}"
            fi
            if [ -z "$branch" ] || [ -z "$sha" ]; then
              echo "::warning::release PR #${number} has no head branch or SHA"
              continue
            fi
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '[.check_runs[].name | select(startswith("platform-verify"))] | length')
            if [ "$existing" -gt 0 ]; then
              echo "::notice::platform-verify already exists for ${sha}; skipping CI dispatch"
              continue
            fi
            gh workflow run "$CI_WORKFLOW" --ref "$branch"
          done <<< "$prs"
      - name: Wait for the release pull request to merge
        if: ${{ inputs.merge-wait-minutes > 0 && inputs.rebuild-tag == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WAIT_MINUTES: ${{ inputs.merge-wait-minutes }}
        run: |
          # shellcheck disable=SC2016 # $sha is a jq --arg, not a shell variable
          set -euo pipefail
          pr=""
          for _ in $(seq 1 12); do
            pr=$(gh pr list --label "autorelease: pending" --state open --limit 1 \
              --json number,headRefName,headRefOid \
              --jq '(.[0] // empty) | "\(.number)\t\(.headRefName)\t\(.headRefOid)"')
            if [ -n "$pr" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$pr" ]; then
            echo "::notice::no open release pull request to merge"
            exit 0
          fi
          IFS=$'\t' read -r number branch sha <<< "$pr"
          approve_pending() {
            ids=$(gh run list --branch "$branch" --event pull_request --limit 20 \
              --json databaseId,conclusion,headSha \
              --jq '.[] | select(.conclusion == "action_required") | "\(.databaseId) \(.headSha)"' \
              | awk -v sha="$1" '$2 == sha {print $1}')
            for id in $ids; do
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null; then
                echo "::notice::approved workflow run ${id}"
              else
                echo "::warning::could not approve workflow run ${id}"
              fi
            done
          }
          approve_pending "$sha"
          for attempt in $(seq 1 $((WAIT_MINUTES * 6))); do
            state=$(gh pr view "$number" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              echo "::notice::release PR #${number} merged"
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "::error::release PR #${number} closed without merging"
              exit 1
            fi
            current=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
            if [ "$current" != "$sha" ]; then
              sha="$current"
              approve_pending "$sha"
            elif [ $((attempt % 6)) -eq 0 ]; then
              approve_pending "$sha"
            fi
            sleep 10
          done
          echo "::notice::release PR #${number} did not merge within ${WAIT_MINUTES} minutes; the next push or scheduled run creates the release"
          exit 0
      - name: Check out the merged default branch
        if: ${{ inputs.rebuild-tag == '' && steps.release-pr.outputs.release_created != 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run release-please after merge
        id: release
        if: ${{ inputs.rebuild-tag == '' && steps.release-pr.outputs.release_created != 'true' }}
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  mode:
    name: mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      uba: ${{ steps.detect.outputs.uba }}
    steps:
      - name: Detect Unity Build Automation credentials
        id: detect
        shell: bash
        env:
          UBA_API_KEY: ${{ secrets.unity_build_api_key }}
          UBA_ORG_ID: ${{ secrets.unity_build_org_id }}
          UBA_PROJECT_ID: ${{ secrets.unity_build_project_id }}
        run: |
          set -euo pipefail
          if [ -n "$UBA_API_KEY" ] && [ -n "$UBA_ORG_ID" ] && [ -n "$UBA_PROJECT_ID" ]; then
            echo "uba=true" >> "$GITHUB_OUTPUT"
          else
            echo "uba=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: [release-please, mode]
    if: ${{ needs.release-please.outputs.release_created == 'true' && (inputs.profile != 'unity' || needs.mode.outputs.uba != 'true') }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Report self-hosted fallback
        if: ${{ inputs.profile == 'unity' }}
        run: echo "::notice::Unity Build Automation not configured; using self-hosted build"
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          clean: ${{ !contains(inputs.runs-on, 'self-hosted') }}
          persist-credentials: false
      - name: Check out dev-platform
        if: ${{ inputs.profile == 'unity' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ghdtmdwns133/dev-platform
          ref: ${{ inputs.platform-ref }}
          path: .dev-platform
          clean: ${{ !contains(inputs.runs-on, 'self-hosted') }}
          persist-credentials: false
      - name: Install tools from mise.toml
        if: ${{ inputs.profile != 'unity' }}
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install uv for the Unity build path
        if: ${{ inputs.profile == 'unity' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build release artifacts
        if: ${{ !contains(inputs.runs-on, 'windows') }}
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"
      - name: Build release artifacts (Windows)
        if: ${{ contains(inputs.runs-on, 'windows') }}
        shell: pwsh
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: Invoke-Expression $env:BUILD_COMMAND
      - name: Upload release artifacts
        if: ${{ inputs.artifact-path != '' && inputs.artifact-name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  build-cloud:
    name: build-cloud
    needs: [release-please, mode]
    if: ${{ needs.release-please.outputs.release_created == 'true' && inputs.profile == 'unity' && needs.mode.outputs.uba == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Build with Unity Build Automation
        uses: ghdtmdwns133/dev-platform/actions/unity-cloud-build@v1
        with:
          ref: ${{ inputs.platform-ref }}
          api-key: ${{ secrets.unity_build_api_key }}
          org-id: ${{ secrets.unity_build_org_id }}
          project-id: ${{ secrets.unity_build_project_id }}
          commit: ${{ github.sha }}
          target: ${{ inputs.unity-build-target }}
      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME//\//-}"
          shopt -s nullglob
          files=(artifacts/reports/unity/cloud-build/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Unity Build Automation produced no artifact"
            exit 1
          fi
          mkdir -p artifacts
          zip -j "artifacts/ProjectDelta-${ref}.zip" "${files[@]}"
      - name: Upload release artifacts
        if: ${{ inputs.artifact-path != '' && inputs.artifact-name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: [release-please, build, build-cloud]
    if: ${{ always() && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true' && (needs.build.result == 'success' || needs.build-cloud.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: release-assets
      - name: Attach release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          HAS_ASSETS: ${{ inputs.artifact-name != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_ASSETS" != "true" ]; then
            echo "::notice::No release assets configured"
            exit 0
          fi
          gh release upload "$TAG_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
