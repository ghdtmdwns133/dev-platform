name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please strategy (python, node or simple).
        required: false
        default: simple
        type: string
      profile:
        description: Verification profile used to set up the toolchain; empty skips the versions check.
        required: false
        default: ""
        type: string
      build-command:
        description: Command that produces the release artifacts.
        required: true
        type: string
      artifact-path:
        description: Path uploaded from the build job and attached to the release.
        required: false
        default: ""
        type: string
      artifact-name:
        description: Artifact name shared between the build and publish jobs.
        required: false
        default: ""
        type: string
      runs-on:
        description: JSON string of runner labels (a quoted string or an array).
        required: false
        default: '"ubuntu-latest"'
        type: string
      ci-workflow:
        description: Caller workflow file dispatched on the release pull request branch.
        required: false
        default: ci.yml
        type: string
      platform-ref:
        description: dev-platform ref checked out for the CLI.
        required: false
        default: v1
        type: string
      unity-build-target:
        description: Unity Build Automation build target id (empty uses unity.cloudBuild.target).
        required: false
        default: ""
        type: string
    secrets:
      unity_build_api_key:
        description: Unity Build Automation API key; enables the cloud build path.
        required: false
      unity_build_org_id:
        description: Unity Cloud organization id.
        required: false
      unity_build_project_id:
        description: Unity Cloud project id.
        required: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release-please configuration
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail
          test -f release-please-config.json || { echo "::error::release-please-config.json is missing"; exit 1; }
          test -f .release-please-manifest.json || { echo "::error::.release-please-manifest.json is missing"; exit 1; }
          configured=$(jq -r '.packages["."]["release-type"] // empty' release-please-config.json)
          if [ -n "$configured" ] && [ "$configured" != "$RELEASE_TYPE" ]; then
            echo "::error::release-please-config.json release-type '${configured}' does not match input '${RELEASE_TYPE}'"
            exit 1
          fi
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Label, auto-merge and dispatch CI for release PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          set -euo pipefail
          gh label create automerge --color 0E8A16 \
            --description "Auto-merge when required checks pass" --force
          prs=$(gh pr list --label "autorelease: pending" --state open \
            --json number,headRefName,headRefOid \
            --jq '.[] | "\(.number)\t\(.headRefName)\t\(.headRefOid)"')
          if [ -z "$prs" ]; then
            echo "::notice::release-please has no open release pull request"
            exit 0
          fi
          while IFS=$'\t' read -r number branch sha; do
            if [ -z "$number" ]; then
              continue
            fi
            gh pr edit "$number" --add-label automerge
            if ! gh pr merge --auto --squash "$number"; then
              echo "::warning::Could not enable auto-merge for release PR #${number}"
            fi
            if [ -z "$branch" ] || [ -z "$sha" ]; then
              echo "::warning::release PR #${number} has no head branch or SHA"
              continue
            fi
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '[.check_runs[].name | select(startswith("platform-verify"))] | length')
            if [ "$existing" -gt 0 ]; then
              echo "::notice::platform-verify already exists for ${sha}; skipping CI dispatch"
              continue
            fi
            gh workflow run "$CI_WORKFLOW" --ref "$branch"
          done <<< "$prs"

  mode:
    name: mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      uba: ${{ steps.detect.outputs.uba }}
    steps:
      - name: Detect Unity Build Automation credentials
        id: detect
        shell: bash
        env:
          UBA_API_KEY: ${{ secrets.unity_build_api_key }}
          UBA_ORG_ID: ${{ secrets.unity_build_org_id }}
          UBA_PROJECT_ID: ${{ secrets.unity_build_project_id }}
        run: |
          set -euo pipefail
          if [ -n "$UBA_API_KEY" ] && [ -n "$UBA_ORG_ID" ] && [ -n "$UBA_PROJECT_ID" ]; then
            echo "uba=true" >> "$GITHUB_OUTPUT"
          else
            echo "uba=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: [release-please, mode]
    if: ${{ needs.release-please.outputs.release_created == 'true' && (inputs.profile != 'unity' || needs.mode.outputs.uba != 'true') }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Report self-hosted fallback
        if: ${{ inputs.profile == 'unity' }}
        shell: bash
        run: echo "::notice::Unity Build Automation not configured; using self-hosted build"
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: ${{ !contains(inputs.runs-on, 'self-hosted') }}
          persist-credentials: false
      - name: Check out dev-platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ghdtmdwns133/dev-platform
          ref: ${{ inputs.platform-ref }}
          path: .dev-platform
          clean: ${{ !contains(inputs.runs-on, 'self-hosted') }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js
        if: ${{ inputs.profile == 'typescript' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up .NET
        if: ${{ inputs.profile == 'dotnet' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Check tool versions
        if: ${{ inputs.profile != '' && !contains(inputs.runs-on, 'windows') }}
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: uv run --project .dev-platform/cli devctl versions --check --profile "$PROFILE"
      - name: Check tool versions (Windows)
        if: ${{ inputs.profile != '' && contains(inputs.runs-on, 'windows') }}
        shell: pwsh
        env:
          PROFILE: ${{ inputs.profile }}
        run: uv run --project .dev-platform/cli devctl versions --check --profile $env:PROFILE
      - name: Build release artifacts
        if: ${{ !contains(inputs.runs-on, 'windows') }}
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"
      - name: Build release artifacts (Windows)
        if: ${{ contains(inputs.runs-on, 'windows') }}
        shell: pwsh
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: Invoke-Expression $env:BUILD_COMMAND
      - name: Upload release artifacts
        if: ${{ inputs.artifact-path != '' && inputs.artifact-name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  build-cloud:
    name: build-cloud
    needs: [release-please, mode]
    if: ${{ needs.release-please.outputs.release_created == 'true' && inputs.profile == 'unity' && needs.mode.outputs.uba == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build with Unity Build Automation
        uses: ghdtmdwns133/dev-platform/actions/unity-cloud-build@v1
        with:
          ref: ${{ inputs.platform-ref }}
          api-key: ${{ secrets.unity_build_api_key }}
          org-id: ${{ secrets.unity_build_org_id }}
          project-id: ${{ secrets.unity_build_project_id }}
          commit: ${{ github.sha }}
          target: ${{ inputs.unity-build-target }}
      - name: Package build
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME//\//-}"
          shopt -s nullglob
          files=(artifacts/reports/unity/cloud-build/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Unity Build Automation produced no artifact"
            exit 1
          fi
          mkdir -p artifacts
          zip -j "artifacts/ProjectDelta-${ref}.zip" "${files[@]}"
      - name: Upload release artifacts
        if: ${{ inputs.artifact-path != '' && inputs.artifact-name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: [release-please, build, build-cloud]
    if: ${{ always() && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true' && (needs.build.result == 'success' || needs.build-cloud.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: release-assets
      - name: Attach release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          HAS_ASSETS: ${{ inputs.artifact-name != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_ASSETS" != "true" ]; then
            echo "::notice::No release assets configured"
            exit 0
          fi
          gh release upload "$TAG_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
