name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please strategy (python, node or simple).
        required: false
        default: simple
        type: string
      profile:
        description: Verification profile used to set up the toolchain; empty skips the versions check.
        required: false
        default: ""
        type: string
      build-command:
        description: Command that produces the release artifacts.
        required: true
        type: string
      artifact-path:
        description: Path uploaded from the build job and attached to the release.
        required: false
        default: ""
        type: string
      artifact-name:
        description: Artifact name shared between the build and publish jobs.
        required: false
        default: ""
        type: string
      runs-on:
        description: JSON string of runner labels (a quoted string or an array).
        required: false
        default: '"ubuntu-latest"'
        type: string
      ci-workflow:
        description: Caller workflow file dispatched on the release pull request branch.
        required: false
        default: ci.yml
        type: string
      platform-ref:
        description: dev-platform ref checked out for the CLI.
        required: false
        default: v1
        type: string

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release-please configuration
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail
          test -f release-please-config.json || { echo "::error::release-please-config.json is missing"; exit 1; }
          test -f .release-please-manifest.json || { echo "::error::.release-please-manifest.json is missing"; exit 1; }
          configured=$(jq -r '.packages["."]["release-type"] // empty' release-please-config.json)
          if [ -n "$configured" ] && [ "$configured" != "$RELEASE_TYPE" ]; then
            echo "::error::release-please-config.json release-type '${configured}' does not match input '${RELEASE_TYPE}'"
            exit 1
          fi
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Label release PR for auto-merge
        if: ${{ steps.release.outputs.pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          number=$(printf '%s' "$PR_JSON" | jq -r 'if type == "object" then .number else . end' 2>/dev/null || true)
          case "$number" in
            "" | null)
              echo "::notice::release-please did not report a pull request number"
              exit 0
              ;;
          esac
          gh pr edit "$number" --add-label automerge
          if ! gh pr merge --auto --squash "$number"; then
            echo "::warning::Could not enable auto-merge for release PR #${number}"
          fi
      - name: Dispatch CI on the release branch
        if: ${{ steps.release.outputs.pr != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "$PR_JSON" | jq -r 'if type == "object" then .headBranchName // empty else empty end')
          if [ -z "$branch" ]; then
            number=$(printf '%s' "$PR_JSON" | jq -r 'if type == "number" then . else empty end')
            if [ -n "$number" ]; then
              branch=$(gh pr view "$number" --json headRefName --jq .headRefName --repo "$GITHUB_REPOSITORY")
            fi
          fi
          if [ -z "$branch" ]; then
            echo "::notice::release-please did not report a pull request branch"
            exit 0
          fi
          gh workflow run "$CI_WORKFLOW" --ref "$branch" --repo "$GITHUB_REPOSITORY"

  build:
    name: build
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: ${{ !contains(inputs.runs-on, 'self-hosted') }}
          persist-credentials: false
      - name: Check out dev-platform
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ghdtmdwns133/dev-platform
          ref: ${{ inputs.platform-ref }}
          path: .dev-platform
          clean: ${{ !contains(inputs.runs-on, 'self-hosted') }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js
        if: ${{ inputs.profile == 'typescript' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up .NET
        if: ${{ inputs.profile == 'dotnet' }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Check tool versions
        if: ${{ inputs.profile != '' && !contains(inputs.runs-on, 'windows') }}
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
        run: uv run --project .dev-platform/cli devctl versions --check --profile "$PROFILE"
      - name: Check tool versions (Windows)
        if: ${{ inputs.profile != '' && contains(inputs.runs-on, 'windows') }}
        shell: pwsh
        env:
          PROFILE: ${{ inputs.profile }}
        run: uv run --project .dev-platform/cli devctl versions --check --profile $env:PROFILE
      - name: Build release artifacts
        if: ${{ !contains(inputs.runs-on, 'windows') }}
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"
      - name: Build release artifacts (Windows)
        if: ${{ contains(inputs.runs-on, 'windows') }}
        shell: pwsh
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: Invoke-Expression $env:BUILD_COMMAND
      - name: Upload release artifacts
        if: ${{ inputs.artifact-path != '' && inputs.artifact-name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        if: ${{ inputs.artifact-name != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: release-assets
      - name: Attach release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          HAS_ASSETS: ${{ inputs.artifact-name != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_ASSETS" != "true" ]; then
            echo "::notice::No release assets configured"
            exit 0
          fi
          gh release upload "$TAG_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
