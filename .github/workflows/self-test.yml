name: Self-test

on:
  push:
    paths-ignore:
      - docs/**
      - "**/*.md"
  pull_request:
    paths-ignore:
      - docs/**
      - "**/*.md"
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Sync CLI dependencies
        run: uv sync --project cli --frozen
      - name: Lint the CLI and bootstrap scripts
        run: uv run --directory cli ruff check --config pyproject.toml . ../scripts
      - name: Check CLI and bootstrap formatting
        run: uv run --directory cli ruff format --check --config pyproject.toml . ../scripts
      - name: Test the CLI
        run: uv run --project cli pytest cli/tests -q

  template:
    name: template (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [python, typescript, dotnet, unity, other]
    env:
      SMOKE: ${{ github.workspace }}/.self-test/smoke-${{ matrix.stack }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Render the template
        env:
          STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          rm -rf "$SMOKE"
          uvx copier==9.19.1 copy --trust --defaults --vcs-ref HEAD \
            --data project_name=smoke \
            --data stack="$STACK" \
            --data create_github_repo=false \
            . "$SMOKE"
      - name: Initialise a git repository
        run: |
          set -euo pipefail
          cd "$SMOKE"
          git init -q -b main
          git config user.email smoke@example.com
          git config user.name smoke
          git add -A
          git commit -q -m "chore: render template"
      - name: Trust the rendered mise configuration
        run: mise trust "$SMOKE/mise.toml"
      - name: Install the rendered toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          working_directory: ${{ env.SMOKE }}
      - name: Run the check task
        working-directory: ${{ env.SMOKE }}
        env:
          SKIP: ${{ matrix.stack == 'unity' && 'unity-integrity' || '' }}
        run: mise run check
      - name: Verify the Unity overlay and CLI surface
        if: ${{ matrix.stack == 'unity' }}
        working-directory: ${{ env.SMOKE }}
        env:
          PLATFORM_CLI: ${{ github.workspace }}/cli
        run: |
          set -euo pipefail
          test -f .devplatform/config.json
          test -f Assets/MyScripts/Editor/DevPlatform/OdinValidatorEntryPoint.cs
          test -f .github/workflows/ci.yml
          uv run --project "$PLATFORM_CLI" devctl unity integrity --help >/dev/null
          uv run --project "$PLATFORM_CLI" devctl verify --help >/dev/null
      - name: Run the test task
        if: ${{ matrix.stack == 'python' || matrix.stack == 'typescript' || matrix.stack == 'dotnet' }}
        working-directory: ${{ env.SMOKE }}
        run: mise run test

  devcontainer:
    name: devcontainer (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [python, typescript, dotnet]
    env:
      SMOKE: ${{ github.workspace }}/.self-test/devcontainer-${{ matrix.stack }}
      DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Render the template
        env:
          STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          rm -rf "$SMOKE"
          uvx copier==9.19.1 copy --trust --defaults --vcs-ref HEAD \
            --data project_name=smoke \
            --data stack="$STACK" \
            --data create_github_repo=false \
            . "$SMOKE"
      - name: Initialise a git repository
        run: |
          set -euo pipefail
          cd "$SMOKE"
          git init -q -b main
          git config user.email smoke@example.com
          git config user.name smoke
          git add -A
          git commit -q -m "chore: render template"
      - name: Start the devcontainer
        run: npx --yes "$DEVCONTAINER_CLI" up --workspace-folder "$SMOKE"
      - name: Run the check task inside the devcontainer
        run: npx --yes "$DEVCONTAINER_CLI" exec --workspace-folder "$SMOKE" bash -lc "mise run check"

  security:
    name: security
    permissions:
      contents: read
      security-events: write
      actions: read
      issues: write
    uses: ./.github/workflows/security.yml
    with:
      upload-sarif: true

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Audit workflows with zizmor
        run: zizmor --format plain --min-severity low --no-progress .github/workflows actions
      - name: Lint workflows with actionlint
        run: actionlint

  notify:
    name: notify
    needs: [cli, template, devcontainer, security, workflow-lint]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Open or update the failure issue
        uses: ./actions/notify
        with:
          status: self-test job failed
          title: "CI failure: ${{ github.workflow }}"
          label: ci-alert
