name: Self-test

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docs: ${{ steps.paths.outputs.docs }}
      docs_files: ${{ steps.paths.outputs.docs_files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # dorny/paths-filter fetches the base branch on push events, including
          # the first push of a private branch. This token is read-only.
          persist-credentials: true
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event.repository.default_branch }}
          predicate-quantifier: some-with-excludes
          list-files: json
          filters: |
            docs:
              - '**/*.{md,mdx}'
            code:
              - '**'
              - '!**/*.{md,mdx}'

  cli:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Sync CLI dependencies
        run: uv sync --project cli --frozen
      - name: Lint the CLI and bootstrap scripts
        run: uv run --directory cli ruff check --config pyproject.toml . ../scripts
      - name: Check CLI and bootstrap formatting
        run: uv run --directory cli ruff format --check --config pyproject.toml . ../scripts
      - name: Test the CLI
        run: uv run --project cli pytest cli/tests -q

  template:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: template (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [python, typescript, dotnet, unity, other]
    env:
      SMOKE: ${{ github.workspace }}/.self-test/smoke-${{ matrix.stack }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Render the template
        env:
          STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          rm -rf "$SMOKE"
          uvx copier==9.19.1 copy --trust --defaults --vcs-ref HEAD \
            --data project_name=smoke \
            --data stack="$STACK" \
            --data create_github_repo=false \
            . "$SMOKE"
      - name: Initialise a git repository
        run: |
          set -euo pipefail
          cd "$SMOKE"
          git init -q -b main
          git config user.email smoke@example.com
          git config user.name smoke
          git add -A
          git commit -q -m "chore: render template"
      - name: Trust the rendered mise configuration
        run: mise trust "$SMOKE/mise.toml"
      - name: Install the rendered toolchain
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          working_directory: ${{ env.SMOKE }}
      - name: Run the check task
        working-directory: ${{ env.SMOKE }}
        env:
          SKIP: ${{ matrix.stack == 'unity' && 'unity-integrity' || '' }}
        run: mise run check
      - name: Verify the Unity overlay and CLI surface
        if: ${{ matrix.stack == 'unity' }}
        working-directory: ${{ env.SMOKE }}
        env:
          PLATFORM_CLI: ${{ github.workspace }}/cli
        run: |
          set -euo pipefail
          test -f .devplatform/config.json
          test -f Assets/MyScripts/Editor/DevPlatform/OdinValidatorEntryPoint.cs
          test -f .github/workflows/ci.yml
          uv run --project "$PLATFORM_CLI" devctl unity integrity --help >/dev/null
          uv run --project "$PLATFORM_CLI" devctl verify --help >/dev/null
      - name: Run the test task
        if: ${{ matrix.stack == 'python' || matrix.stack == 'typescript' || matrix.stack == 'dotnet' }}
        working-directory: ${{ env.SMOKE }}
        run: mise run test

  devcontainer:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: devcontainer (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: [python, typescript, dotnet]
    env:
      SMOKE: ${{ github.workspace }}/.self-test/devcontainer-${{ matrix.stack }}
      DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Render the template
        env:
          STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          rm -rf "$SMOKE"
          uvx copier==9.19.1 copy --trust --defaults --vcs-ref HEAD \
            --data project_name=smoke \
            --data stack="$STACK" \
            --data create_github_repo=false \
            . "$SMOKE"
      - name: Initialise a git repository
        run: |
          set -euo pipefail
          cd "$SMOKE"
          git init -q -b main
          git config user.email smoke@example.com
          git config user.name smoke
          git add -A
          git commit -q -m "chore: render template"
      - name: Start the devcontainer
        run: npx --yes "$DEVCONTAINER_CLI" up --workspace-folder "$SMOKE"
      - name: Run the check task inside the devcontainer
        run: npx --yes "$DEVCONTAINER_CLI" exec --workspace-folder "$SMOKE" bash -lc "mise run check"

  security:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: security
    permissions:
      contents: read
      security-events: write
      actions: read
      issues: write
    uses: ./.github/workflows/security.yml
    with:
      upload-sarif: true

  workflow-lint:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install tools from mise.toml
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Audit workflows with zizmor
        run: zizmor --format plain --min-severity low --no-progress .github/workflows actions
      - name: Lint workflows with actionlint
        run: actionlint

  notify:
    name: notify
    needs: [cli, template, devcontainer, security, workflow-lint]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Open or update the failure issue
        uses: ./actions/notify
        with:
          status: self-test job failed
          title: "CI failure: ${{ github.workflow }}"
          label: ci-alert

  docs:
    name: docs
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml
    with:
      files-json: ${{ needs.changes.outputs.docs_files }}
      platform-ref: ${{ github.sha }}

  quality-gate:
    name: quality-gate
    if: always()
    needs: [changes, cli, template, devcontainer, security, workflow-lint, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required checks
        env:
          EVENT: ${{ github.event_name }}
          CHANGE_STATUS: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          CLI: ${{ needs.cli.result }}
          TEMPLATE: ${{ needs.template.result }}
          DEVCONTAINER: ${{ needs.devcontainer.result }}
          SECURITY: ${{ needs.security.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          DOC_CHECK: ${{ needs.docs.result }}
        run: |
          set -euo pipefail
          test "$CHANGE_STATUS" = success
          if [[ "$CODE" = true || "$EVENT" = schedule || "$EVENT" = workflow_dispatch ]]; then
            for status in "$CLI" "$TEMPLATE" "$DEVCONTAINER" "$SECURITY" "$WORKFLOW_LINT"; do
              test "$status" = success
            done
          fi
          if [[ "$DOCS" = true ]]; then
            test "$DOC_CHECK" = success
          fi
