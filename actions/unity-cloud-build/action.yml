name: Unity Build Automation
description: Build a commit with Unity Build Automation and download the primary artifact.
inputs:
  ref:
    description: dev-platform git ref to check out.
    required: false
    default: v1
  api-key:
    description: Unity Build Automation API key.
    required: true
  org-id:
    description: Unity Cloud organization id.
    required: true
  project-id:
    description: Unity Cloud project id.
    required: true
  target:
    description: Build target id (falls back to unity.cloudBuild.target in the repository config).
    required: false
    default: ""
  commit:
    description: Commit to build (defaults to the checked-out HEAD).
    required: false
    default: ""
  timeout-min:
    description: Maximum minutes to wait for the build (defaults to the config value).
    required: false
    default: ""
  download:
    description: Artifact directory (defaults to artifacts/reports/unity/cloud-build).
    required: false
    default: ""
  working-directory:
    description: Unity project directory relative to the workspace root.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Check out dev-platform
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ghdtmdwns133/dev-platform
        ref: ${{ inputs.ref }}
        path: .dev-platform
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Build with Unity Build Automation
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        UNITY_BUILD_API_KEY: ${{ inputs.api-key }}
        UNITY_BUILD_ORG_ID: ${{ inputs.org-id }}
        UNITY_BUILD_PROJECT_ID: ${{ inputs.project-id }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_TIMEOUT_MIN: ${{ inputs.timeout-min }}
        INPUT_DOWNLOAD: ${{ inputs.download }}
        PLATFORM_CLI: ${{ github.workspace }}/.dev-platform/cli
      run: |
        set -euo pipefail
        args=(unity cloud-build)
        if [ -n "$INPUT_TARGET" ]; then
          args+=(--target "$INPUT_TARGET")
        fi
        if [ -n "$INPUT_COMMIT" ]; then
          args+=(--commit "$INPUT_COMMIT")
        fi
        if [ -n "$INPUT_TIMEOUT_MIN" ]; then
          args+=(--timeout-min "$INPUT_TIMEOUT_MIN")
        fi
        if [ -n "$INPUT_DOWNLOAD" ]; then
          args+=(--download "$INPUT_DOWNLOAD")
        fi
        uv run --project "$PLATFORM_CLI" devctl "${args[@]}"
    - name: Upload Unity Build Automation report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: unity-cloud-build
        path: |
          ${{ inputs.working-directory }}/artifacts/reports/unity/cloud-build.json
          ${{ inputs.working-directory }}/artifacts/reports/unity/cloud-build/**
        if-no-files-found: warn
        retention-days: 14
