name: Security scan
description: Run trivy, gitleaks, zizmor and actionlint, then publish SARIF and SBOM artifacts.
inputs:
  severity:
    description: Comma-separated trivy severities that fail the scan.
    required: false
    default: HIGH,CRITICAL
  upload-sarif:
    description: Upload the SARIF reports to GitHub code scanning.
    required: false
    default: "false"
  deep:
    description: Run zizmor in pedantic mode and report medium-severity findings.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Prepare report directory
      shell: bash
      run: mkdir -p artifacts/security
    - name: Install trivy
      shell: bash
      env:
        TRIVY_VERSION: "0.74.0"
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -sSL -o "$tmp/$archive" "$base/$archive"
        curl -sSL -o "$tmp/checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
        (cd "$tmp" && grep -F "  ${archive}" checksums.txt | sha256sum -c -)
        sudo tar -xzf "$tmp/$archive" -C /usr/local/bin trivy
        trivy --version
    - name: Trivy filesystem scan
      shell: bash
      env:
        SEVERITY: ${{ inputs.severity }}
      run: |
        set -euo pipefail
        trivy fs \
          --scanners vuln,secret,misconfig \
          --severity "$SEVERITY" \
          --ignore-unfixed \
          --format sarif \
          --output artifacts/security/trivy.sarif \
          --exit-code 1 \
          --skip-dirs .dev-platform \
          --skip-dirs node_modules \
          --skip-dirs artifacts \
          --skip-dirs Library \
          --skip-dirs Temp \
          --skip-dirs Logs \
          .
    - name: Trivy configuration scan
      shell: bash
      env:
        SEVERITY: ${{ inputs.severity }}
      run: |
        set -euo pipefail
        trivy config \
          --severity "$SEVERITY" \
          --exit-code 1 \
          --skip-dirs .dev-platform \
          --skip-dirs node_modules \
          --skip-dirs artifacts \
          --skip-dirs Library \
          --skip-dirs Temp \
          --skip-dirs Logs \
          .
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        curl -sSL -o "$tmp/gitleaks.tar.gz" "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSL -o "$tmp/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        (cd "$tmp" && grep -F "  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum -c -)
        sudo tar -xzf "$tmp/gitleaks.tar.gz" -C /usr/local/bin gitleaks
        gitleaks version
    - name: Scan for leaked secrets
      shell: bash
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        gitleaks git . --redact --report-format sarif --report-path artifacts/security/gitleaks.sarif --exit-code 1
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        python-version: "3.12"
    - name: Audit workflows with zizmor
      shell: bash
      env:
        DEEP: ${{ inputs.deep }}
      run: |
        set -euo pipefail
        paths=(.github/workflows)
        if [ -d actions ]; then
          paths+=(actions)
        fi
        if [ "$DEEP" = "true" ]; then
          uvx zizmor==1.31.1 --format sarif --persona pedantic --min-severity medium --no-progress "${paths[@]}" > artifacts/security/zizmor.sarif
        else
          uvx zizmor==1.31.1 --format sarif --min-severity high --no-progress "${paths[@]}" > artifacts/security/zizmor.sarif
        fi
    - name: Lint workflows with actionlint
      shell: bash
      run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7
    - name: Generate CycloneDX SBOM
      shell: bash
      run: |
        set -euo pipefail
        trivy fs \
          --scanners vuln \
          --format cyclonedx \
          --output artifacts/security/sbom.cdx.json \
          --exit-code 0 \
          --skip-dirs .dev-platform \
          --skip-dirs node_modules \
          --skip-dirs artifacts \
          --skip-dirs Library \
          --skip-dirs Temp \
          --skip-dirs Logs \
          .
    - name: Upload SARIF results
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
      with:
        sarif_file: artifacts/security
        category: dev-platform
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: security-reports
        path: artifacts/security/**
        if-no-files-found: warn
        retention-days: 14
