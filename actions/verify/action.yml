name: Verify
description: Run the shared devctl verification for one profile and publish its reports.
inputs:
  profile:
    description: Verification profile (python, typescript, dotnet, unity or unity-assets).
    required: true
  min-coverage:
    description: Minimum line coverage percentage passed to devctl verify.
    required: false
    default: "0"
  working-directory:
    description: Project directory relative to the workspace root.
    required: false
    default: "."
  ref:
    description: dev-platform git ref to check out.
    required: false
    default: v1
runs:
  using: composite
  steps:
    - name: Check out dev-platform
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ghdtmdwns133/dev-platform
        ref: ${{ inputs.ref }}
        path: .dev-platform
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Set up Node.js
      if: ${{ inputs.profile == 'typescript' }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - name: Set up .NET
      if: ${{ inputs.profile == 'dotnet' }}
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        global-json-file: ${{ inputs.working-directory }}/global.json
    - name: Check tool versions
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROFILE: ${{ inputs.profile }}
        PLATFORM_CLI: ${{ github.workspace }}/.dev-platform/cli
      run: uv run --project "$PLATFORM_CLI" devctl versions --check --profile "$PROFILE"
    - name: Run devctl verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROFILE: ${{ inputs.profile }}
        MIN_COVERAGE: ${{ inputs.min-coverage }}
        PLATFORM_CLI: ${{ github.workspace }}/.dev-platform/cli
      run: uv run --project "$PLATFORM_CLI" devctl verify --profile "$PROFILE" --min-coverage "$MIN_COVERAGE"
    - name: Upload verification reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: reports-${{ inputs.profile }}
        path: ${{ inputs.working-directory }}/artifacts/reports/**
        if-no-files-found: warn
        retention-days: 14
