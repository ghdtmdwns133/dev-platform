name: Notify CI failure
description: Create or update the open failure issue for a workflow.
inputs:
  status:
    description: Short description of what failed.
    required: true
  title:
    description: Issue title; an open issue with the same title is commented on instead of duplicated.
    required: true
  label:
    description: Issue label used to find existing failure issues.
    required: false
    default: ci-alert
  profile:
    description: devctl profile named in the local repro command.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Create or update failure issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        LABEL: ${{ inputs.label }}
        TITLE: ${{ inputs.title }}
        STATUS: ${{ inputs.status }}
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        gh label create "$LABEL" --force >/dev/null 2>&1 || true
        body=$(printf '%s\n' \
          "- Workflow: ${GITHUB_WORKFLOW}" \
          "- Job: ${GITHUB_JOB}" \
          "- Commit: ${GITHUB_SHA}" \
          "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          "- Failed step: ${STATUS}")
        if [ -n "${PROFILE:-}" ]; then
          body=$(printf '%s\n%s' "$body" "- Local repro: \`devctl verify --profile ${PROFILE}\`")
        fi
        existing=$(gh issue list --state open --label "$LABEL" --limit 100 --json number,title \
          --jq '[.[] | select(.title == env.TITLE)] | first | .number // empty')
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "$body"
        else
          gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
        fi
