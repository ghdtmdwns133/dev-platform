name: Auto-merge

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    name: auto-merge
    permissions:
      contents: write
      pull-requests: write
    uses: __OWNER__/dev-platform/.github/workflows/auto-merge.yml@__PLATFORM_REF__
