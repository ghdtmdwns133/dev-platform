name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - docs/**
      - "**/*.md"
  pull_request:
    paths-ignore:
      - docs/**
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-verify:
    name: platform-verify
    permissions:
      contents: read
      issues: write
    uses: __OWNER__/dev-platform/.github/workflows/quality.yml@__PLATFORM_REF__
    with:
      profile: __PROFILE__
      min-coverage: __MIN_COVERAGE__
      enable-codecov: __ENABLE_CODECOV__
      platform-ref: __PLATFORM_REF__
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  platform-security:
    name: platform-security
    permissions:
      contents: read
      issues: write
      security-events: write
      actions: read
    uses: __OWNER__/dev-platform/.github/workflows/security.yml@__PLATFORM_REF__
    with:
      upload-sarif: __UPLOAD_SARIF__
      platform-ref: __PLATFORM_REF__
