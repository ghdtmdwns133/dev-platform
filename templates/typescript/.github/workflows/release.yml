name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-release:
    name: platform-release
    permissions:
      contents: write
      pull-requests: write
    uses: __OWNER__/dev-platform/.github/workflows/release.yml@__PLATFORM_REF__
    with:
      release-type: node
      profile: typescript
      build-command: npm ci && npm run build && zip -r dist.zip dist
      artifact-path: dist.zip
      artifact-name: web-dist
      platform-ref: __PLATFORM_REF__
    secrets:
      release_token: ${{ secrets.RELEASE_TOKEN }}
