name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - docs/**
      - "**/*.md"
  pull_request:
    paths-ignore:
      - docs/**
      - "**/*.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-verify:
    name: platform-verify
    permissions:
      contents: read
      issues: write
    uses: __OWNER__/dev-platform/.github/workflows/unity.yml@__PLATFORM_REF__
    with:
      unity-runner: none
      unity-version: "6000.5.1f1"
      platform-ref: __PLATFORM_REF__
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

  platform-security:
    name: platform-security
    permissions:
      contents: read
      issues: write
      security-events: write
      actions: read
    uses: __OWNER__/dev-platform/.github/workflows/security.yml@__PLATFORM_REF__
    with:
      upload-sarif: __UPLOAD_SARIF__
      platform-ref: __PLATFORM_REF__
