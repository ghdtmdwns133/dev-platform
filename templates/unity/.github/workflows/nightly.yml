name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-nightly:
    name: platform-nightly
    permissions:
      contents: read
      issues: write
      security-events: write
      actions: read
    uses: __OWNER__/dev-platform/.github/workflows/nightly.yml@__PLATFORM_REF__
    with:
      profile: __PROFILE__
      platform-ref: __PLATFORM_REF__
    secrets:
      copilot_assign_token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
