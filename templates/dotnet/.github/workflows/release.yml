name: Release

on:
  push:
    branches: [main]
  workflow_run: # zizmor: ignore[dangerous-triggers] only merges the trusted release PR via gh API; no untrusted checkout
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      rebuild-tag:
        description: Existing release tag to rebuild and re-attach assets for (empty = normal release flow)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-release:
    name: platform-release
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    uses: __OWNER__/dev-platform/.github/workflows/release.yml@__PLATFORM_REF__
    with:
      release-type: simple
      rebuild-tag: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild-tag || '' }}
      profile: dotnet
      build-command: dotnet pack -c Release -o dist
      artifact-path: dist
      artifact-name: dist
      platform-ref: __PLATFORM_REF__
